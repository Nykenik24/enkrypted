<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>WS Test</title>

        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                font-family: sans-serif;
                background: #1e1e1e;
                color: #ddd;
            }

            #log {
                position: absolute;
                top: 0;
                bottom: 60px;
                left: 0;
                right: 0;
                overflow-y: auto;
                padding: 10px;
            }

            .msg {
                margin: 4px 0;
                padding: 6px 8px;
                border-radius: 4px;
                background: #2a2a2a;
                font-family: monospace;
            }

            .kind {
                color: #6cf;
                margin-right: 6px;
            }

            #form {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 60px;
                display: flex;
                gap: 8px;
                padding: 10px;
                background: #111;
                box-sizing: border-box;
            }

            input,
            select,
            button {
                background: #222;
                color: #ddd;
                border: 1px solid #444;
                padding: 6px;
                border-radius: 4px;
            }

            #msg {
                flex: 1;
            }
        </style>

        <script>
            window.onload = function () {
                let conn;
                const log = document.getElementById("log");
                const msg = document.getElementById("msg");
                const kind = document.getElementById("kind");

                function append(kindStr, payload) {
                    const el = document.createElement("div");
                    el.className = "msg";

                    const k = document.createElement("span");
                    k.className = "kind";
                    k.textContent = kindStr;

                    const p = document.createElement("span");
                    p.textContent =
                        typeof payload === "string"
                            ? payload
                            : JSON.stringify(payload);

                    el.appendChild(k);
                    el.appendChild(p);

                    const shouldScroll =
                        log.scrollTop >=
                        log.scrollHeight - log.clientHeight - 5;

                    log.appendChild(el);

                    if (shouldScroll) {
                        log.scrollTop = log.scrollHeight;
                    }
                }

                document.getElementById("form").onsubmit = function () {
                    if (!conn || conn.readyState !== WebSocket.OPEN) {
                        return false;
                    }

                    const value = msg.value.trim();
                    if (!value) return false;

                    const event = {
                        kind: kind.value,
                        payload: value,
                    };

                    conn.send(JSON.stringify(event));
                    msg.value = "";
                    return false;
                };

                if ("WebSocket" in window) {
                    conn = new WebSocket("ws://" + location.host + "/ws");

                    conn.onopen = () => append("system", "connected");
                    conn.onclose = () => append("system", "disconnected");

                    conn.onmessage = (evt) => {
                        try {
                            const ev = JSON.parse(evt.data);
                            append(ev.kind, ev.payload);
                        } catch (e) {
                            append("raw", evt.data);
                        }
                    };
                } else {
                    append("error", "WebSocket not supported");
                }
            };
        </script>
    </head>

    <body>
        <div id="log"></div>

        <form id="form">
            <select id="kind">
                <option value="enkr:msg">message</option>
                <option value="enkr:ping">ping</option>
            </select>
            <input
                id="msg"
                type="text"
                placeholder="type something..."
                autofocus
            />
            <button type="submit">Send</button>
        </form>
    </body>
</html>
